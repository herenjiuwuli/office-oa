name: CI

# M2：把三层测试接进 CI 做回归
#   ① 静态扫描（前端未声明标识符等 —— 拦「build 过但运行时 ReferenceError」）
#   ② 接口测试（vitest，295 条：鉴权 / 权限 / 审批流 / 状态机 / 附件 / AI / 导出 / 会议室 / 统计 / 考勤 / 跨模块对账 / 批量审批）
#   ③ UI 测试（Playwright，13 条：跑一整条 提交 → 两级审批 → 归档 + 驳回重提）
#   ④ 真机断言（自写零依赖 CDP 脚本，81 条）
#
# ⚠️ 为什么 ③ 和 ④ 都要留着（不是重复）：
#   ③ 是标准框架（自动等待 / 重试 / trace / 报告），④ 是零依赖直连 CDP。
#   两者跑同一条业务链路、互为交叉验证，但**覆盖面不一样**：
#   ③ 目前只覆盖 M1/M2 那批功能（审批链路 / 附件 / AI / 守卫），
#   ④ 还额外覆盖了 **M5 会议室 / M6 统计 / M7 考勤** 的真机行为。
#   之前 ④ 没进 CI，等于「最近三个模块的 UI 层零回归保护」—— 改坏了 CI 照样绿。这一轮补上。
#
#   ⭐ ④ 以前失败时只往 stdout 打几行字，而 CI 里没人盯 stdout —— 于是「M5/M6/M7 的
#     UI 回归坏了」这件事拿不到现场。现在它失败会自动往 test-results/oa-ui-check/ 写
#     截图 + 页面可见文本 + 页面异常 + report.txt，由下面 `if: failure()` 的步骤上传。
#
# ⭐ 不下载浏览器：Playwright 配了 channel: 'chrome'，用 GitHub runner
#    （ubuntu-latest 镜像自带 Google Chrome stable）已装的 Chrome，省掉几百 MB 下载。
#    ④ 的脚本同样复用系统 Chrome，所以也不需要任何浏览器下载步骤。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: 装依赖（根目录 + web 各自一份）
        run: |
          npm ci
          npm --prefix web ci

      - name: ① 静态扫描（前端）
        run: npm run check:frontend

      - name: 构建前端产物（后端要托管 web/dist）
        run: npm run build

      - name: ② 接口测试（vitest）
        run: npm test

      - name: ③ UI 测试（Playwright，用系统 Chrome）
        run: npm run test:e2e

      - name: ④ 真机断言（自写零依赖 CDP 脚本，81 条，覆盖会议室/统计/考勤/批量审批）
        run: |
          # 这份脚本会真实写库（走真链路），所以先把库重置到种子态
          node seed.js --force
          # 它要求服务已就绪（Playwright 的自带 webServer 只管 ③ 那一步，这里要自己起）
          node index.js &
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:3200/health > /dev/null; then echo "服务就绪"; break; fi
            sleep 1
          done
          node scripts/oa-ui-check.mjs

      - name: 失败时上传 Playwright 报告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: 失败时上传真机断言现场（截图 + 页面文本 + 页面异常 + 报告）
        # ④ 是 M5/M6/M7 的 UI 行为在 CI 里的**唯一**保护。它以前失败时只往
        # stdout 打几行字，而 CI 里没人盯 stdout —— 断言说「没找到元素」，
        # 但页面停在哪个 URL、长什么样、控制台报了什么，全都没留下。
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: oa-ui-check-evidence
          # ⚠️ 是 evidence/ 不是 test-results/oa-ui-check/ —— 后者会被 Playwright
          #    每次启动时的清理顺手删掉（实测还会因文件数超阈值让清理本身失败）
          path: evidence/
          retention-days: 7
          if-no-files-found: ignore
