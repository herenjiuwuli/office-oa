name: CI

# M2：把分层测试接进 CI 做回归（2026-10-27 起为五层）
#   ① 静态扫描（前端未声明标识符等 —— 拦「build 过但运行时 ReferenceError」）
#   ①b 静态扫描（文档引用 —— README / docs / CI 里引用的文件必须真的存在）
#   ② 接口测试（vitest，295 条：鉴权 / 权限 / 审批流 / 状态机 / 附件 / AI / 导出 / 会议室 / 统计 / 考勤 / 跨模块对账 / 批量审批）
#   ③ UI 测试（Playwright，13 条：跑一整条 提交 → 两级审批 → 归档 + 驳回重提）
#   ④ 真机断言（自写零依赖 CDP 脚本：会议室 / 统计 / 考勤 / 批量审批）
#   ⑤ 覆盖率（v8，基线锁；2026-10-27 实测 语句 89.53 / 分支 78.64 / 函数 98.95 / 行 93.67）
#   ⑥ Docker 镜像真机构建 + 起容器跑一遍（独立 job；ubuntu-latest 自带 Docker，不依赖本机）
#      —— Dockerfile 的坑全在运行期（alpine 没 curl / 容器内绑回环 / prune 删多了），
#         静态校验一条都抓不到，只能真构建一次。
#
# ⭐ 为什么 ⑤ 要单独一层：② 只能说「295 条跑过了」，说不出「测到了多少代码」。
#    两件事分开看，才不会被「全绿」这个词糊住 —— 同一个项目里就出现过
#    「接口全绿、UI 一打开是错的」，那是覆盖面问题，不是断言问题。
#
# ⚠️ 条数**刻意不写死**：源码里 `check(` 共 **82** 处，而实跑是 **81** 条（有 1 处在分支里
#    不一定执行）—— 写死任何一个都会有一半时候是错的。准确数看运行输出的「通过 N / N」。
#    （同一类问题在 api-test-platform 也出现过：注释写「43 条」，而实际早已是 45。）
#
# ⚠️ 为什么 ③ 和 ④ 都要留着（不是重复）：
#   ③ 是标准框架（自动等待 / 重试 / trace / 报告），④ 是零依赖直连 CDP。
#   两者跑同一条业务链路、互为交叉验证，但**覆盖面不一样**：
#   ③ 目前只覆盖 M1/M2 那批功能（审批链路 / 附件 / AI / 守卫），
#   ④ 还额外覆盖了 **M5 会议室 / M6 统计 / M7 考勤** 的真机行为。
#   之前 ④ 没进 CI，等于「最近三个模块的 UI 层零回归保护」—— 改坏了 CI 照样绿。这一轮补上。
#
#   ⭐ ④ 以前失败时只往 stdout 打几行字，而 CI 里没人盯 stdout —— 于是「M5/M6/M7 的
#     UI 回归坏了」这件事拿不到现场。现在它失败会自动往 test-results/oa-ui-check/ 写
#     截图 + 页面可见文本 + 页面异常 + report.txt，由下面 `if: failure()` 的步骤上传。
#
# ⭐ 不下载浏览器：Playwright 配了 channel: 'chrome'，用 GitHub runner
#    （ubuntu-latest 镜像自带 Google Chrome stable）已装的 Chrome，省掉几百 MB 下载。
#    ④ 的脚本同样复用系统 Chrome，所以也不需要任何浏览器下载步骤。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: 装依赖（根目录 + web 各自一份）
        run: |
          # ⚠️ --legacy-peer-deps 不能去掉：npm 10.9.x 解析这棵依赖树时会崩在
          # arborist 的 "Cannot read properties of null (reading 'edgesOut')"。
          # 2026-10-27 加了 @vitest/coverage-v8 之后开始复现（本机 npm ci --dry-run 稳定重现），
          # 而 npm install 会重新解析整棵树、反而看不出问题。
          npm ci --legacy-peer-deps
          npm --prefix web ci

      - name: ① 静态扫描（前端）
        run: npm run check:frontend

      - name: ①b 静态扫描（文档引用）—— README / docs / CI 里引用的文件必须真的存在
        # 便宜且精确（存在就是存在），所以适合当门禁。实测抓到过：
        # README 截图表指向 docs/screenshots/10-移动端390.png，而磁盘上是 15-…，  # refcheck-ignore
        # 引用挂很久没人发现 —— 因为 Markdown 表格里它只是行内代码，渲染无异样。
        run: npm run check:docs

      - name: 构建前端产物（后端要托管 web/dist）
        run: npm run build

      - name: ② 接口测试（vitest）
        run: npm test

      - name: ③ UI 测试（Playwright，用系统 Chrome）
        run: npm run test:e2e

      - name: ④ 真机断言（自写零依赖 CDP 脚本：覆盖会议室/统计/考勤/批量审批）
        # 与本地跑的是**同一条命令**：它自己备隔离环境（data/ui-check.db + 3400 端口）、
        # 自己起服务、跑完自己收。以前这里手写「seed --force + node index.js & + curl 轮询」，
        # 和本地那份是两套逻辑 —— 现在只有一套，不会再各自漂移。
        run: npm run check:ui:auto

      - name: 失败时上传 Playwright 报告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: ⑤ 覆盖率（基线锁：语句 88 / 分支 76 / 函数 97 / 行 93）
        # 2026-10-27 实测：语句 89.53 / 分支 78.64 / 函数 98.95 / 行 93.67（1012 行）
        # 阈值取实测值向下取整 —— 作用是「不许偷偷降」，不是假装达标。
        # 单独一层而不是塞进 ②：② 只证明「测试过了」，这一层证明「测到了多少代码」，
        # 两件事分开看才不会被「295 条全绿」这种数字糊住。
        run: npm run test:cov

      - name: 覆盖率报告（留档，方便回看趋势）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oa-coverage-summary
          path: coverage/coverage-summary.json
          retention-days: 7
          if-no-files-found: ignore

      - name: 失败时上传真机断言现场（截图 + 页面文本 + 页面异常 + 报告）
        # ④ 是 M5/M6/M7 的 UI 行为在 CI 里的**唯一**保护。它以前失败时只往
        # stdout 打几行字，而 CI 里没人盯 stdout —— 断言说「没找到元素」，
        # 但页面停在哪个 URL、长什么样、控制台报了什么，全都没留下。
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: oa-ui-check-evidence
          # ⚠️ 是 evidence/ 不是 test-results/oa-ui-check/ —— 后者会被 Playwright
          #    每次启动时的清理顺手删掉（实测还会因文件数超阈值让清理本身失败）
          path: evidence/
          retention-days: 7
          if-no-files-found: ignore

  # ⑥ Docker 镜像真机构建 + 起容器跑一遍（独立 job）
  #
  # 存在的理由：Dockerfile / docker-compose / entrypoint 这三样东西，之前只做过
  # 「静态校验」（bash -n、确认 ENTRYPOINT 引用的文件存在），**一次都没真构建过**。
  # 而 Docker 配置的坑全在运行期：alpine 里没有 curl、容器内绑 127.0.0.1 导致
  # 宿主端口映射连不进来、npm prune 把运行期依赖删了……
  # 静态校验一条都抓不到 —— 「看起来对」和「真的能起」差得远。
  #
  # 不依赖本机装 Docker：ubuntu-latest 自带。以后谁改 Dockerfile，这里会立刻红。
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: 构建镜像
        run: docker build -t office-oa:ci .

      - name: 起容器
        run: docker run -d --name oa -p 3200:3200 office-oa:ci

      - name: 宿主侧能连上（这条专抓「容器内绑 127.0.0.1」）
        # 容器里只监听回环时，容器自己 curl 得通、宿主永远连不上，
        # 现象是「docker ps 显示 Up，浏览器就是打不开」——最容易误判的一种。
        run: |
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:3200/health >/dev/null 2>&1; then
              echo "第 $i 秒连上：$(curl -s http://127.0.0.1:3200/health)"
              exit 0
            fi
            sleep 1
          done
          echo "40 秒内宿主连不上 3200"
          docker logs oa || true
          exit 1

      - name: 镜像自带的 HEALTHCHECK 要真的变 healthy
        # Dockerfile 里那条用 node fetch 写的健康检查（alpine 没有 curl），
        # 写错了不会报错，只会永远 unhealthy —— 必须真看一眼状态。
        run: |
          for i in $(seq 1 40); do
            s=$(docker inspect --format '{{.State.Health.Status}}' oa 2>/dev/null || echo none)
            echo "第 $i 秒：$s"
            [ "$s" = "healthy" ] && exit 0
            sleep 1
          done
          docker logs oa || true
          exit 1

      - name: 用种子账号真登录一次（证明 entrypoint 的 seed 生效）
        # 密码从 seed.js 里读，不写死 —— 写死的话改一次种子密码这条测试就假红。
        run: |
          PW=$(grep -oE "DEFAULT_PASSWORD = '[^']+'" seed.js | head -1 | sed -E "s/.*'(.*)'/\1/")
          test -n "$PW" || { echo "没从 seed.js 解析到默认密码"; exit 1; }
          code=$(curl -s -o /tmp/login.json -w '%{http_code}' -X POST http://127.0.0.1:3200/api/auth/login \
            -H 'Content-Type: application/json' -d "{\"username\":\"admin\",\"password\":\"$PW\"}")
          echo "HTTP $code"
          head -c 200 /tmp/login.json; echo
          test "$code" = "200" || { echo "登录失败，seed 可能没跑起来"; exit 1; }

      - name: 首页能打开（证明 web/dist 进了镜像）
        run: |
          curl -fsS http://127.0.0.1:3200/ -o /tmp/index.html
          grep -o '<title>[^<]*</title>' /tmp/index.html || true
          grep -q "assets/" /tmp/index.html || { echo "首页没有 assets 引用，前端大概率没构建进镜像"; exit 1; }

      - name: 失败时打容器日志
        if: failure()
        run: docker logs oa || true

      - name: 清理
        if: always()
        run: docker rm -f oa || true
